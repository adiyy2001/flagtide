quarkus.application.name=flagwire-server
quarkus.banner.enabled=false
quarkus.log.category."io.quarkus".level=INFO

flagwire.persistence=postgres
flagwire.change-log.retention=1000

quarkus.http.host=127.0.0.1
quarkus.http.port=8080
quarkus.http.limits.max-body-size=1M
quarkus.shutdown.timeout=10S
quarkus.jackson.fail-on-unknown-properties=true
quarkus.jackson.write-dates-as-timestamps=false

quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${FLAGWIRE_CORS_ORIGINS:http://localhost:14200,http://127.0.0.1:14200,http://localhost:14300,http://127.0.0.1:14300}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type,If-Match,If-None-Match
quarkus.http.cors.exposed-headers=ETag,Location
quarkus.http.cors.access-control-max-age=1H

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.max-size=16
quarkus.datasource.devservices.image-name=postgres:18.6
quarkus.flyway.migrate-at-start=true

quarkus.smallrye-openapi.path=/q/openapi

flagwire.seed.enabled=false
