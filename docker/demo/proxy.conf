map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

map $request_method $write_limit_key {
  GET '';
  HEAD '';
  OPTIONS '';
  default 'write';
}

limit_req_zone $write_limit_key zone=writes:1m rate=10r/s;

server {
  listen 8080;
  server_name _;
  absolute_redirect off;
  server_tokens off;
  client_max_body_size 64k;
  root /usr/share/nginx/html;

  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;

  location = / {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self' data:; frame-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    try_files /index.html =404;
  }

  location = /landing.css {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location = /admin {
    return 301 /admin/;
  }

  location /admin/ {
    proxy_pass http://admin:8080/;
  }

  location = /shop {
    return 301 /shop/;
  }

  location ~ ^/shop/[^/]+\.(?:js|mjs|css|json|svg|png|ico|woff2|txt)$ {
    rewrite ^/shop/(.*)$ /$1 break;
    proxy_pass http://demo-shop:8080;
  }

  location /shop/ {
    proxy_pass http://demo-shop:8080;
  }

  location /api/ {
    limit_req zone=writes burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://server-a:8080;
  }

  location = /sdk/v1/stream {
    proxy_pass http://server-b:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  location /sdk/ {
    proxy_pass http://server-b:8080;
  }

  location / {
    return 404;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
